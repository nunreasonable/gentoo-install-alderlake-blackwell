# Overlay LOCAL do gentoo-install. Existe por um motivo unico: empacotar a
# Material Symbols Rounded, que o Clavis Shell exige e que nao existe em
# ::gentoo nem na GURU.
#
# Sem ele, a fonte seria o unico artefato do projeto inteiro instalado fora do
# Portage — sem rastreio, sem `emerge --unmerge`, invisivel ao `qfile`.
masters = gentoo

# Manifests COMPLETOS (nao thin): o overlay nao e sincronizado por git, e o
# manifest e gerado na propria maquina por `ebuild ... manifest`. Thin manifests
# dependeriam de metadados de VCS que este diretorio nao tem.
thin-manifests = false
sign-manifests = false
use-manifests = strict

# Nunca sincroniza: o conteudo vem do repositorio do instalador, nao da rede.
